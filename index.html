let currentLevel = 0;
let currentSection = 0;
const quizState = {};
const LS_KEY = 'phonTrainerProgress_v3';

// ================= ПРОГРЕСС =================
function loadProgress() {
    try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        Object.keys(saved).forEach(id => { quizState[id] = saved[id]; });
    } catch (e) { }
}
function saveProgress() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(quizState)); } catch (e) { }
}

const levelsEl = document.getElementById('levels-container');
const tabsEl = document.getElementById('tabs-container');
const contentEl = document.getElementById('content-container');

// ================= ОТРИСОВКА =================
function renderLevels() {
    levelsEl.innerHTML = '';
    ALL_LEVELS.forEach((lvl, i) => {
        const b = document.createElement('button');
        b.className = 'level-btn' + (i === currentLevel ? ' active' : '');
        b.innerHTML = '<span class="lvl-num">' + (i+1) + '</span>' + lvl.title.replace('Уровень ', '');
        b.title = lvl.subtitle;
        b.onclick = () => { currentLevel = i; currentSection = 0; renderLevels(); renderTabs(); renderSection(); };
        levelsEl.appendChild(b);
    });
}

function renderTabs() {
    tabsEl.innerHTML = '';
    const lvl = ALL_LEVELS[currentLevel];
    lvl.sections.forEach((sec, i) => {
        const b = document.createElement('button');
        let cls = 'tab-btn' + (sec.isTest ? ' test-tab' : '');
        if (i === currentSection) cls += ' active';
        if (sec.isTest && quizState[sec.id] && quizState[sec.id].done) {
            b.textContent = sec.title + ' (' + quizState[sec.id].score + '/' + sec.quiz.length + ')';
        } else {
            b.textContent = sec.title;
        }
        b.className = cls;
        b.onclick = () => { currentSection = i; renderTabs(); renderSection(); };
        tabsEl.appendChild(b);
    });
}

function escapeJs(s) { return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function renderSection() {
    const lvl = ALL_LEVELS[currentLevel];
    const sec = lvl.sections[currentSection];
    contentEl.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    if (sec.isTest) card.style.borderLeftColor = '#27ae60';

    if (sec.isTest) {
        card.innerHTML = '<h2 style="color:#27ae60;">' + sec.title + '</h2>'
            + '<div class="quiz-container" id="quiz-' + sec.id + '">'
            + '<div class="quiz-word-row">'
            +   '<div class="quiz-word" id="qw-' + sec.id + '">Загрузка...</div>'
            +   '<button class="btn-quiz-sound" id="qsb-' + sec.id + '">🔊</button>'
            + '</div>'
            + '<div class="quiz-counter" id="qc-' + sec.id + '"></div>'
            + '<div class="quiz-hint">Выберите правильный вариант:</div>'
            + '<div class="options" id="qo-' + sec.id + '"></div>'
            + '<div class="quiz-score" id="qs-' + sec.id + '" style="display:none;"></div>'
            + '<button class="btn-next" id="qn-' + sec.id + '">Следующий вопрос ➔</button>'
            + '<button class="btn-restart" id="qr-' + sec.id + '">Пройти заново</button>'
            + '</div>';
        contentEl.appendChild(card);
        if (!quizState[sec.id]) {
            quizState[sec.id] = { q: 0, score: 0, answered: false, done: false };
        }
        document.getElementById('qn-' + sec.id).onclick = () => nextQuestion(sec.id, sec.quiz);
        document.getElementById('qr-' + sec.id).onclick = () => restartQuiz(sec.id);
        loadQuestion(sec.id, sec.quiz);
    } else {
        let wordsHtml = '';
        sec.words.forEach((word, idx) => {
            const waveId = 'w-' + sec.id + '-' + idx;
            wordsHtml += '<div class="example-block">'
                + '<div class="ex-header"><div class="ex-en">' + word.en + '</div><div class="ex-ru">' + word.ru + '</div></div>'
                + '<div class="ex-tip">' + word.tip + '</div>'
                + '<div class="btn-row">'
                +   '<button class="btn-sound" onclick="playAudio(\'' + escapeJs(word.en) + '\', \'' + waveId + '\', this, 1)">🔊 Слушать</button>'
                +   '<button class="btn-sound btn-slow" onclick="playAudio(\'' + escapeJs(word.en) + '\', \'' + waveId + '\', this, 0.6)">🐢 Медленно</button>'
                +   '<button class="btn-sound btn-repeat" onclick="requestVoice(\'' + escapeJs(word.en) + '\')">🎤 Повторить</button>'
                + '</div>'
                + '<div class="wave-container" id="' + waveId + '"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>'
                + '</div>';
        });
        card.innerHTML = '<h2>' + sec.title + '</h2>' + sec.description + '<div class="words-grid">' + wordsHtml + '</div>';
        contentEl.appendChild(card);
    }
}

// ================= АУДИО =================
let currentAudio = null;
let currentUtterance = null;
let currentWaveId = null;
let currentBtn = null;

function stopCurrentAudio() {
    if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
    if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
    currentUtterance = null;
    if (currentWaveId) {
        const w = document.getElementById(currentWaveId);
        if (w) w.classList.remove('active');
        currentWaveId = null;
    }
    if (currentBtn) {
        currentBtn.classList.remove('speaking');
        currentBtn.disabled = false;
        currentBtn = null;
    }
}

function markStarted(waveId, btn) {
    currentWaveId = waveId;
    currentBtn = btn || null;
    if (waveId) {
        const w = document.getElementById(waveId);
        if (w) w.classList.add('active');
    }
    if (btn) { btn.classList.add('speaking'); btn.disabled = true; }
}

function markFinished() {
    if (currentWaveId) {
        const w = document.getElementById(currentWaveId);
        if (w) w.classList.remove('active');
        currentWaveId = null;
    }
    if (currentBtn) {
        currentBtn.classList.remove('speaking');
        currentBtn.disabled = false;
        currentBtn = null;
    }
}

function tryGoogleTTS(text, rate, onSuccess, onFail) {
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-us&q=' + encodeURIComponent(text);
    const audio = new Audio(url);
    audio.playbackRate = rate;
    let settled = false;
    const timer = setTimeout(() => { if (!settled) { settled = true; try { audio.pause(); } catch (e) {} onFail(); } }, 4000);
    audio.onended = () => { if (!settled) { settled = true; clearTimeout(timer); onSuccess(); } };
    audio.onerror = () => { if (!settled) { settled = true; clearTimeout(timer); onFail(); } };
    audio.play().then(() => { currentAudio = audio; if (!settled) onSuccess(); }).catch(() => { if (!settled) { settled = true; clearTimeout(timer); onFail(); } });
}

function trySpeechSynthesis(text, rate, onSuccess, onFail) {
    if (!('speechSynthesis' in window)) { onFail(); return; }
    try {
        const voices = speechSynthesis.getVoices();
        const voice = voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        if (voice) u.voice = voice;
        u.rate = rate;
        u.onend = onSuccess;
        u.onerror = onFail;
        currentUtterance = u;
        speechSynthesis.speak(u);
    } catch (e) { onFail(); }
}

function playAudio(text, waveId, btn, rate) {
    stopCurrentAudio();
    markStarted(waveId, btn);
    tryGoogleTTS(text, rate,
        () => { markFinished(); },
        () => {
            trySpeechSynthesis(text, rate,
                () => { markFinished(); },
                () => { markFinished(); }
            );
        }
    );
}

if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
    speechSynthesis.getVoices();
}

// ================= ТЕСТЫ =================
function loadQuestion(sectionId, quizData) {
    const st = quizState[sectionId];
    const qw = document.getElementById('qw-' + sectionId);
    const qo = document.getElementById('qo-' + sectionId);
    const qs = document.getElementById('qs-' + sectionId);
    const qn = document.getElementById('qn-' + sectionId);
    const qc = document.getElementById('qc-' + sectionId);
    if (!qw) return;

    if (st.q >= quizData.length) {
        qw.textContent = "Тест завершен!";
        qc.textContent = '';
        qo.innerHTML = '';
        qn.style.display = 'none';
        qs.style.display = 'block';
        let txt = "Вы набрали " + st.score + " из " + quizData.length + ". ";
        if (st.score === quizData.length) txt += "Идеально! 🎉";
        else if (st.score > quizData.length / 2) txt += "Отличный результат! 💪";
        else txt += "Стоит повторить теорию. 👀";
        qs.innerHTML = '<span style="font-size:22px;">' + txt + '</span>';
        return;
    }

    st.answered = false;
    qn.style.display = 'none';
    qs.style.display = 'none';
    qc.textContent = 'Вопрос ' + (st.q + 1) + ' из ' + quizData.length;

    const q = quizData[st.q];
    qw.textContent = q.word;
    const options = [q.correct, q.wrong];
    for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
    }
    qo.innerHTML = '';
    options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'option-btn';
        b.textContent = opt;
        b.onclick = () => checkAnswer(sectionId, quizData, b, opt, q.correct);
        qo.appendChild(b);
    });
}

function checkAnswer(sectionId, quizData, btn, selected, correct) {
    const st = quizState[sectionId];
    if (st.answered) return;
    st.answered = true;
    if (selected === correct) {
        btn.classList.add('correct');
        st.score++;
    } else {
        btn.classList.add('wrong');
        document.querySelectorAll('#qo-' + sectionId + ' .option-btn').forEach(b => {
            if (b.textContent === correct) b.classList.add('correct');
        });
    }
    document.querySelectorAll('#qo-' + sectionId + ' .option-btn').forEach(b => { b.disabled = true; });
    const qs = document.getElementById('qs-' + sectionId);
    qs.style.display = 'block';
    qs.textContent = 'Текущий счёт: ' + st.score + ' из ' + (st.q + 1);
    const qn = document.getElementById('qn-' + sectionId);
    qn.textContent = (st.q + 1 >= quizData.length) ? 'Показать результат ➔' : 'Следующий вопрос ➔';
    qn.style.display = 'inline-block';
    saveProgress();
    renderTabs();
}

function nextQuestion(sectionId, quizData) {
    const st = quizState[sectionId];
    st.q++;
    if (st.q >= quizData.length) st.done = true;
    saveProgress();
    loadQuestion(sectionId, quizData);
    renderTabs();
}

function restartQuiz(sectionId) {
    let found = null;
    for (const lvl of ALL_LEVELS) {
        found = lvl.sections.find(s => s.id === sectionId);
        if (found) break;
    }
    if (!found || !found.quiz) return;
    quizState[sectionId] = { q: 0, score: 0, answered: false, done: false };
    saveProgress();
    loadQuestion(sectionId, found.quiz);
    renderTabs();
}

// ================= ОТПРАВКА В БОТА =================
function requestVoice(word) {
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.sendData(JSON.stringify({
            type: "request_pronunciation",
            word: word
        }));
        window.Telegram.WebApp.close();
    } else {
        alert("Эта функция работает только внутри Telegram!");
    }
}

// ================= СТАРТ =================
loadProgress();
renderLevels();
renderTabs();
renderSection();
</script>
